<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#24B587"/>
      <stop offset="100%" style="stop-color:#0A5C45"/>
    </linearGradient>
    <linearGradient id="brand2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DCE97"/>
      <stop offset="100%" style="stop-color:#1D9E75"/>
    </linearGradient>
  </defs>

  <!-- ── LIGHT BACKGROUND VERSION ── -->
  <rect x="0" y="0" width="800" height="240" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="240" fill="#f9f8f5"/>

  <!-- Icon: 3 ascending bars in a rounded square -->
  <rect x="60" y="60" width="100" height="100" rx="22" fill="url(#brand)"/>

  <!-- Bar 1 — shortest -->
  <rect x="78" y="118" width="18" height="28" rx="5" fill="white" opacity="0.45"/>
  <!-- Bar 2 — medium -->
  <rect x="101" y="104" width="18" height="42" rx="5" fill="white" opacity="0.72"/>
  <!-- Bar 3 — tallest -->
  <rect x="124" y="88" width="18" height="58" rx="5" fill="white"/>

  <!-- Wordmark: clarant -->
  <text x="182" y="124"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="52"
    font-weight="300"
    letter-spacing="-1.5"
    fill="#1a1a1a">clarant</text>

  <!-- Labs subtext -->
  <text x="184" y="148"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="6"
    fill="#1D9E75">LABS</text>

  <!-- Tagline -->
  <text x="184" y="172"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="3"
    fill="#aaa">BUILT FOR HUMANS</text>

  <!-- Label -->
  <text x="400" y="220"
    text-anchor="middle"
    font-family="system-ui"
    font-size="10"
    fill="#ccc"
    letter-spacing="2">LIGHT</text>

  <!-- ── DARK BACKGROUND VERSION ── -->
  <rect x="0" y="250" width="800" height="240" fill="#111111"/>

  <!-- Icon -->
  <rect x="60" y="308" width="100" height="100" rx="22" fill="url(#brand)"/>
  <rect x="78" y="366" width="18" height="28" rx="5" fill="white" opacity="0.45"/>
  <rect x="101" y="352" width="18" height="42" rx="5" fill="white" opacity="0.72"/>
  <rect x="124" y="336" width="18" height="58" rx="5" fill="white"/>

  <!-- Wordmark -->
  <text x="182" y="372"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="52"
    font-weight="300"
    letter-spacing="-1.5"
    fill="#ffffff">clarant</text>

  <!-- Labs -->
  <text x="184" y="396"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="13"
    font-weight="500"
    letter-spacing="6"
    fill="#1D9E75">LABS</text>

  <!-- Tagline -->
  <text x="184" y="420"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="3"
    fill="rgba(255,255,255,0.3)">BUILT FOR HUMANS</text>

  <!-- Label -->
  <text x="400" y="468"
    text-anchor="middle"
    font-family="system-ui"
    font-size="10"
    fill="rgba(255,255,255,0.15)"
    letter-spacing="2">DARK</text>
</svg>
